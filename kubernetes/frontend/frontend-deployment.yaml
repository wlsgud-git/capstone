apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: my-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173

          envFrom:
            - configMapRef:
                name: frontend-config

apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: dirjins/my-backend:v1
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: backend-config

            - configMapRef:
                name: mysql-config

            - secretRef:
                name: backend-secret

            - secretRef:
                name: mysql-secret
